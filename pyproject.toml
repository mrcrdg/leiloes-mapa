[project]
name = "leiloes"
version = "0.1.0"
description = "Mapa de imóveis em leilão de Londrina-PR"
requires-python = ">=3.12"
dependencies = ["httpx", "selectolax", "pillow"]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/leiloes"]

[tool.pytest.ini_options]
testpaths = ["tests"]
